# .github/workflows/release.yml
#
# Triggers:
#   git tag v260626.0 && git push origin v260626.0
#   — or — manually via GitHub Actions UI (workflow_dispatch),
#            supplying the existing tag name.
#
# Structure (6 jobs):
#   setup   : creates the draft GitHub Release, exposes RELEASE_TAG to
#             the other jobs via a job output.
#   rpm     : unchanged OBS pipeline (trigger service run, poll _result,
#             download, verify, checksum, upload as release assets).
#   fedora  : COPR pipeline. Unlike OBS, COPR has no server-side
#             "watch this git repo and rewrite Version: for me" service,
#             so this job does that part itself: checks out the exact
#             tag, patches Version: in the Fedora spec, builds the SRPM
#             locally with `git archive` + `rpmbuild -bs`, then submits
#             that SRPM to COPR and blocks on `copr-cli watch-build`.
#   aur     : AUR has no build service at all — it only hosts PKGBUILD +
#             .SRCINFO, and users' own machines build the package. So
#             this job just bumps pkgver/sha256sums in build/arch/PKGBUILD,
#             regenerates .SRCINFO with makepkg (needs an Arch container,
#             since makepkg doesn't exist on Ubuntu runners), and git
#             pushes both files to the AUR's own git remote over SSH.
#   publish : un-drafts the release, only once rpm, fedora, and aur have
#             all succeeded.
#   cleanup : deletes the draft if anything failed anywhere.
#
# Secrets (Settings → Secrets and variables → Actions):
#   OBS_TRIGGER_TOKEN   Recommended. osc token --create home:itachi_re yuki-iptv
#   OBS_USER / OBS_PASSWORD   Optional; home: projects are public.
#
#   COPR_LOGIN, COPR_USERNAME, COPR_TOKEN
#                       From https://copr.fedorainfracloud.org/api/  →
#                       "API Token" page. These three lines are exactly
#                       what that page hands you as a ready-made
#                       ~/.config/copr file — copy them in as three
#                       separate secrets rather than one blob so none of
#                       them show up in logs individually.
#
#   AUR_SSH_PRIVATE_KEY
#                       A dedicated SSH keypair (ssh-keygen -t ed25519 -f
#                       aur -N ""). Add the *public* half at
#                       https://aur.archlinux.org/account/ → "My Account"
#                       → SSH Public Key. Paste the *private* half in as
#                       this secret. The very first push has to create the
#                       AUR package; that happens automatically as long as
#                       PKGBUILD's pkgbase matches the repo name
#                       (yuki-iptv) and the key is registered first.
#   AUR_EMAIL           Optional. Git commit author email for the AUR repo;
#                       falls back to a generic noreply address if unset.
#
# No additional secret is needed for the GitHub Release itself; the
# built-in GITHUB_TOKEN covers that.

name: Release & Publish (OBS + COPR)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-release (e.g. v260626.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  OBS_PROJECT:    "home:itachi_re"
  OBS_PACKAGE:    "yuki-iptv"
  OBS_REPOSITORY: "openSUSE_Tumbleweed"
  OBS_ARCH:       "x86_64"
  OBS_API:        "https://api.opensuse.org"
  POLL_INTERVAL:  30
  POLL_TIMEOUT:   3600

  COPR_PROJECT:   "yuki-iptv"
  # Space-separated. Fedora 44 is current stable as of this writing;
  # bump/add chroots as releases roll — nothing else in the job needs
  # to change.
  COPR_CHROOTS:   "fedora-44-x86_64 fedora-43-x86_64"

jobs:
  # ── setup ─────────────────────────────────────────────────────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Resolve RELEASE_TAG
        id: resolve
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub Release
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists — reusing it."
          else
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --verify-tag \
              --draft
          fi

  # ── rpm (OBS / openSUSE) ─────────────────────────────────────────────
  rpm:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
    steps:
      - name: Trigger OBS rebuild
        env:
          OBS_TRIGGER_TOKEN: ${{ secrets.OBS_TRIGGER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OBS_TRIGGER_TOKEN:-}" ]; then
            echo "OBS_TRIGGER_TOKEN not set — skipping rebuild trigger."
            exit 0
          fi
          curl -sf \
            --retry 10 --retry-delay 5 --retry-all-errors \
            -X POST \
            -H "Authorization: Token ${OBS_TRIGGER_TOKEN}" \
            "${OBS_API}/trigger/runservice?project=${OBS_PROJECT}&package=${OBS_PACKAGE}"
          echo "Triggered source-service re-run for ${OBS_PROJECT}/${OBS_PACKAGE}"

      - name: Wait for OBS build and download RPMs
        env:
          OBS_USER:     ${{ secrets.OBS_USER }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p rpms

          CURL_AUTH=()
          if [ -n "${OBS_USER:-}" ]; then
            CURL_AUTH=(-u "${OBS_USER}:${OBS_PASSWORD}")
          fi

          RESULT_URL="${OBS_API}/build/${OBS_PROJECT}/_result?package=${OBS_PACKAGE}"
          LIST_URL="${OBS_API}/build/${OBS_PROJECT}/${OBS_REPOSITORY}/${OBS_ARCH}/${OBS_PACKAGE}"

          elapsed=0
          ready=""

          while [ "$elapsed" -lt "$POLL_TIMEOUT" ]; do
            RESULT_HTTP=$(curl -sS \
              --retry 5 --retry-delay 5 --retry-all-errors \
              "${CURL_AUTH[@]}" \
              -H "Accept: application/xml" \
              -w "%{http_code}" \
              -o result.xml \
              "$RESULT_URL" || true)
            if [ "$RESULT_HTTP" != "200" ]; then
              echo "::error::RESULT_URL returned HTTP ${RESULT_HTTP} — giving up."
              exit 1
            fi

            code=$(python3 - "$OBS_REPOSITORY" "$OBS_ARCH" "result.xml" <<'PYEOF'
          import sys, xml.etree.ElementTree as ET
          repo, arch, path = sys.argv[1], sys.argv[2], sys.argv[3]
          root = ET.parse(path).getroot()
          code = ""
          for r in root.findall("result"):
              if r.get("repository") == repo and r.get("arch") == arch:
                  s = r.find("status")
                  code = s.get("code") if s is not None else ""
                  break
          print(code)
          PYEOF
            )

            echo "OBS status for ${OBS_PACKAGE}: ${code:-unknown}  [${elapsed}s elapsed]"

            case "$code" in
              failed|broken|unresolvable)
                echo "::error::OBS build '${code}' for ${OBS_PACKAGE}." \
                     "See https://build.opensuse.org/package/show/${OBS_PROJECT}/${OBS_PACKAGE}"
                exit 1
                ;;
              succeeded)
                ACTIVE_LIST_URL="$LIST_URL"
                X86_HTTP=$(curl -sS \
                  --retry 5 --retry-delay 5 --retry-all-errors \
                  "${CURL_AUTH[@]}" \
                  -H "Accept: application/xml" \
                  -w "%{http_code}" \
                  -o binarylist.xml \
                  "$LIST_URL" || true)

                binary_count=$(python3 -c "
          import xml.etree.ElementTree as ET
          try:
              print(len(ET.parse('binarylist.xml').getroot().findall('binary')))
          except Exception:
              print(0)
          " 2>/dev/null || echo 0)

                if [ "$X86_HTTP" != "200" ] || [ "$binary_count" -eq 0 ]; then
                  NOARCH_LIST_URL="${OBS_API}/build/${OBS_PROJECT}/${OBS_REPOSITORY}/noarch/${OBS_PACKAGE}"
                  NOARCH_HTTP=$(curl -sS \
                    --retry 5 --retry-delay 5 --retry-all-errors \
                    "${CURL_AUTH[@]}" \
                    -H "Accept: application/xml" \
                    -w "%{http_code}" \
                    -o binarylist.xml \
                    "$NOARCH_LIST_URL" || true)
                  if [ "$NOARCH_HTTP" != "200" ]; then
                    echo "::error::Both x86_64 (HTTP ${X86_HTTP}) and noarch (HTTP ${NOARCH_HTTP}) paths failed."
                    exit 1
                  fi
                  ACTIVE_LIST_URL="$NOARCH_LIST_URL"
                fi

                mapfile -t FILES < <(python3 - "$OBS_PACKAGE" "$RELEASE_TAG" "binarylist.xml" <<'PYEOF'
          import sys, xml.etree.ElementTree as ET
          pkg, tag, path = sys.argv[1], sys.argv[2], sys.argv[3]
          root = ET.parse(path).getroot()
          needle = f"-{tag}-"
          matched = []
          for b in root.findall("binary"):
              name = b.get("filename", "")
              if not name.endswith(".rpm"):
                  continue
              if "debuginfo" in name or "debugsource" in name:
                  continue
              if not name.startswith(pkg):
                  continue
              if needle not in name:
                  continue
              matched.append(name)
          for m in matched:
              print(m)
          PYEOF
                )

                if [ "${#FILES[@]}" -gt 0 ]; then
                  ready="yes"
                  break
                fi
                ;;
            esac

            sleep "$POLL_INTERVAL"
            elapsed=$((elapsed + POLL_INTERVAL))
          done

          if [ -z "$ready" ]; then
            echo "::error::Timed out after ${POLL_TIMEOUT}s waiting for" \
                 "OBS to publish ${RELEASE_TAG} artifacts."
            exit 1
          fi

          for f in "${FILES[@]}"; do
            DL_URL="${ACTIVE_LIST_URL}/${f}"
            DL_HTTP=$(curl -sS \
              --retry 5 --retry-delay 5 --retry-all-errors \
              "${CURL_AUTH[@]}" \
              -w "%{http_code}" \
              -o "rpms/$f" \
              "$DL_URL" || true)
            if [ "$DL_HTTP" != "200" ]; then
              echo "::error::Download of ${f} returned HTTP ${DL_HTTP}"
              exit 1
            fi
          done

          ls -la rpms/

      - name: Verify RPM integrity
        run: rpm -K --nosignature rpms/*.rpm

      - name: Generate checksums
        run: |
          cd rpms
          sha256sum *.rpm > SHA256SUMS

      - name: Upload OBS assets to draft release
        run: gh release upload "$RELEASE_TAG" rpms/*.rpm rpms/SHA256SUMS --repo "${{ github.repository }}" --clobber

  # ── fedora (COPR) ─────────────────────────────────────────────────────
  fedora:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
    steps:
      # Checked out at the exact tag so `git archive` below produces
      # byte-identical content to what the tag actually points at —
      # this is the job's stand-in for OBS's tar_scm service.
      - name: Checkout at release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.release_tag }}
          fetch-tags: true
          fetch-depth: 0

      - name: Install rpmbuild + copr-cli
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm
          pip install --user copr-cli

      # Stand-in for OBS's set_version: derive the bare version from the
      # tag and patch it into the Fedora spec, same "strip the v prefix"
      # convention already used for the Arch PKGBUILD's pkgver.
      - name: Patch spec Version
        id: version
        run: |
          set -euo pipefail
          FEDORA_VERSION="${RELEASE_TAG#v}"
          echo "version=$FEDORA_VERSION" >> "$GITHUB_OUTPUT"
          sed -i "s/^Version:.*/Version:        ${FEDORA_VERSION}/" build/rpm/fedora/yuki-iptv.spec
          grep -E '^(Name|Version|Release):' build/rpm/fedora/yuki-iptv.spec

      # Build the exact tarball Source0 expects, locally, from the
      # checked-out tag — instead of relying on COPR to fetch it from
      # GitHub at build time. Same content GitHub's own tag-archive
      # endpoint would produce, just generated ourselves for determinism.
      - name: Build SRPM
        env:
          FEDORA_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p rpmbuild/{SOURCES,SPECS,SRPMS}
          git archive --format=tar --prefix="yuki-iptv-${FEDORA_VERSION}/" HEAD \
            | gzip > "rpmbuild/SOURCES/yuki-iptv-${FEDORA_VERSION}.tar.gz"
          cp build/rpm/fedora/yuki-iptv.spec rpmbuild/SPECS/
          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bs rpmbuild/SPECS/yuki-iptv.spec
          ls -la rpmbuild/SRPMS/

      - name: Configure copr-cli
        env:
          COPR_LOGIN:    ${{ secrets.COPR_LOGIN }}
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
          COPR_TOKEN:    ${{ secrets.COPR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COPR_LOGIN:-}" ] || [ -z "${COPR_USERNAME:-}" ] || [ -z "${COPR_TOKEN:-}" ]; then
            echo "::error::One or more of COPR_LOGIN / COPR_USERNAME / COPR_TOKEN secrets are unset or empty. Check Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          mkdir -p ~/.config
          cat > ~/.config/copr <<EOF
          [copr-cli]
          login = ${COPR_LOGIN}
          username = ${COPR_USERNAME}
          token = ${COPR_TOKEN}
          copr_url = https://copr.fedorainfracloud.org
          EOF
          chmod 600 ~/.config/copr

      # Submit + block until every requested chroot finishes. watch-build
      # exits non-zero on any chroot failure, which is why there's no
      # manual polling loop here the way there is in the OBS job — COPR
      # gives you the blocking wait for free.
      - name: Submit build to COPR and wait
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          SRPM=$(ls rpmbuild/SRPMS/*.src.rpm)

          # shellcheck disable=SC2086
          BUILD_OUTPUT=$(copr-cli build "$COPR_PROJECT" "$SRPM" \
            $(for c in $COPR_CHROOTS; do echo "--chroot $c"; done) \
            --nowait)
          echo "$BUILD_OUTPUT"

          BUILD_ID=$(echo "$BUILD_OUTPUT" | grep -oP 'Created builds:\s*\K[0-9]+' | head -n1)
          if [ -z "$BUILD_ID" ]; then
            echo "::error::Could not parse a build ID out of copr-cli's output."
            exit 1
          fi
          echo "COPR build ID: $BUILD_ID"
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"

          timeout "$POLL_TIMEOUT" copr-cli watch-build "$BUILD_ID"

      - name: Download built RPMs
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p rpms-fedora
          copr-cli download-build "$BUILD_ID" --dest rpms-fedora

          mkdir -p rpms-fedora-flat
          find rpms-fedora -name '*.rpm' \
            ! -name '*debuginfo*' ! -name '*debugsource*' ! -name '*.src.rpm' \
            -exec cp {} rpms-fedora-flat/ \;
          ls -la rpms-fedora-flat/

      - name: Verify RPM integrity
        run: rpm -K --nosignature rpms-fedora-flat/*.rpm

      - name: Generate checksums
        run: |
          cd rpms-fedora-flat
          sha256sum *.rpm > SHA256SUMS

      - name: Upload COPR assets to draft release
        run: gh release upload "$RELEASE_TAG" rpms-fedora-flat/*.rpm rpms-fedora-flat/SHA256SUMS --repo "${{ github.repository }}" --clobber

  # ── aur (Arch User Repository) ──────────────────────────────────────
  aur:
    needs: setup
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
    steps:
      # base-devel has makepkg but not git/openssh by default. makepkg
      # also refuses to run as root (the default user in this image),
      # so a throwaway unprivileged user is created for the one step
      # that actually invokes it.
      - name: Install tooling
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git openssh
          useradd -m builder

      - name: Checkout at release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-tags: true
          fetch-depth: 0

      - name: Configure SSH for AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY secret is unset. See the" \
                 "comment block at the top of this file for setup steps."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" >> "$GITHUB_ENV"

      # Push-to-create: if this is the very first release, this clone is
      # of an AUR repo that doesn't have any commits yet, which is fine —
      # AUR creates the package on first push as long as the SSH key is
      # registered and PKGBUILD's pkgbase matches "yuki-iptv".
      - name: Clone AUR package repo
        run: git clone ssh://aur@aur.archlinux.org/yuki-iptv.git aur-repo

      - name: Bump pkgver, pkgrel and checksum
        id: pkgver
        run: |
          set -euo pipefail
          PKGVER="${RELEASE_TAG#v}"
          echo "pkgver=$PKGVER" >> "$GITHUB_OUTPUT"

          cp build/arch/PKGBUILD aur-repo/PKGBUILD
          cd aur-repo

          sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

          # The real published tarball, not a local `git archive` —
          # GitHub's tag-archive endpoint is what PKGBUILD's source=
          # line points at, and that's what needs to match sha256sums.
          curl -fsSL -o "/tmp/src.tar.gz" \
            "https://github.com/itachi-re/yuki-iptv/archive/refs/tags/${RELEASE_TAG}.tar.gz"
          SUM=$(sha256sum /tmp/src.tar.gz | cut -d' ' -f1)
          sed -i "s/^sha256sums=.*/sha256sums=('${SUM}')/" PKGBUILD

      - name: Generate .SRCINFO
        run: |
          set -euo pipefail
          chown -R builder:builder aur-repo
          su builder -c "cd aur-repo && makepkg --printsrcinfo > .SRCINFO"
          cat aur-repo/.SRCINFO

      - name: Commit and push to AUR
        env:
          PKGVER: ${{ steps.pkgver.outputs.pkgver }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
        run: |
          set -euo pipefail
          cd aur-repo
          git config user.name "itachi-re"
          git config user.email "${AUR_EMAIL:-noreply@users.noreply.github.com}"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No changes to publish to AUR."
            exit 0
          fi
          git commit -m "Update to ${PKGVER}"
          git push origin master

  # ── publish ──────────────────────────────────────────────────────────
  publish:
    needs: [setup, rpm, fedora, aur]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
    steps:
      - name: Un-draft the release
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --draft=false
          echo "Published: $(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json url -q .url)"

  # ── cleanup ──────────────────────────────────────────────────────────
  cleanup:
    needs: [setup, rpm, fedora, aur, publish]
    if: failure()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
    steps:
      - name: Delete draft release on failure
        run: gh release delete "$RELEASE_TAG" --repo "${{ github.repository }}" --yes || true
